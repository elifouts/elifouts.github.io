<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eli Fouts - Portfolio</title>
    <script>
        // GitHub Pages compatibility redirect
        if (window.location.pathname.includes('/pages/pages/')) {
            const newPath = window.location.pathname.replace('/pages/pages/', '/pages/');
            window.location.replace(newPath);
        }
    </script>
</head>
<body>
    <script>
        // Redirect to the main site if someone accesses a malformed URL
        if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') {
            window.location.href = '/';
        }
    </script>
</body>
</html>
